# Lint, test and build every push and pull request; deploy main to GitHub Pages.
# One-time setup (see README): add the GIPHY_API_KEY repository secret and set
# Settings → Pages → Source to "GitHub Actions".
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes a pull request's running checks; runs on main queue instead, so a deployment is
# never cancelled halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read by scripts/write-env.mjs (npm postinstall, start, build). Empty on forks' pull requests,
      # which is fine: every automated test mocks the Giphy API.
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build for GitHub Pages
        env:
          # The site is served from /<repository-name>/, so the repository name never has to be hard-coded.
          BASE_HREF: /${{ github.event.repository.name }}/
        run: npm run build -- --base-href "$BASE_HREF"

      # GitHub Pages serves 404.html for unknown paths; the app's own router then takes over.
      - name: Add SPA fallback
        run: cp dist/gif-search/browser/index.html dist/gif-search/browser/404.html

      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/gif-search/browser

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
