<button
  type="button"
  class="group relative block w-full overflow-hidden rounded-card bg-surface-container-high focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary"
  [style.aspect-ratio]="$aspectRatio()"
  [attr.aria-label]="'Open details for ' + $gif().title"
  (click)="$open.emit($gif())"
>
  <img
    class="block size-full object-cover transition-transform duration-300 group-hover:scale-105 motion-reduce:transition-none"
    [src]="$gif().preview.url"
    [width]="$gif().preview.width"
    [height]="$gif().preview.height"
    [alt]="$gif().altText"
    loading="lazy"
    decoding="async"
  />
  <span
    class="pointer-events-none absolute inset-x-0 bottom-0 line-clamp-2 bg-linear-to-t from-black/70 to-transparent px-3 pt-8 pb-2.5 text-left text-sm font-medium text-white opacity-0 transition-opacity duration-200 group-hover:opacity-100 group-focus-visible:opacity-100"
  >
    {{ $gif().title }}
  </span>
</button>
