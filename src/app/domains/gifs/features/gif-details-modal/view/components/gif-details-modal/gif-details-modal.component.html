@if (facade.$gif(); as gif) {
  <!-- Positioned by a wrapper: Material's own button styles win over Tailwind utilities.
       z-10 keeps it above the title, which Material also positions. -->
  <div class="absolute top-3 right-3 z-10">
    <button matIconButton mat-dialog-close type="button" aria-label="Close details">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <h2 mat-dialog-title class="break-words">{{ gif.title }}</h2>

  <mat-dialog-content>
    <div class="grid gap-6 md:grid-cols-[minmax(0,1fr)_16rem] md:items-start">
      <div class="relative mx-auto w-fit max-w-full overflow-hidden rounded-card bg-surface-container-high">
        @if (gif.original.stillUrl; as stillUrl) {
          <!-- Still frame shown until the animated GIF paints over it. -->
          <img class="absolute inset-0 size-full object-contain" [src]="stillUrl" alt="" aria-hidden="true" />
        }
        <img
          class="relative block h-auto max-h-[55vh] w-auto max-w-full"
          [src]="gif.original.url"
          [width]="gif.original.width"
          [height]="gif.original.height"
          [alt]="gif.altText"
        />
      </div>

      <app-gif-meta-list [gif]="gif" />
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <a matButton="tonal" [href]="gif.pageUrl" target="_blank" rel="noopener noreferrer">
      <mat-icon>open_in_new</mat-icon>
      Open on GIPHY
    </a>
  </mat-dialog-actions>
}
