@if (facade.$gif(); as gif) {
  <!-- Positioned by a wrapper: Material's own button styles win over Tailwind utilities.
       z-10 keeps it above the title, which Material also positions. -->
  <div class="absolute top-3 right-3 z-10">
    <button matIconButton mat-dialog-close type="button" aria-label="Close details">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <h2 mat-dialog-title class="break-words">{{ gif.title }}</h2>

  <mat-dialog-content>
    <div class="grid gap-6 md:grid-cols-[minmax(0,1fr)_16rem] md:items-start">
      <div class="relative mx-auto w-fit max-w-full overflow-hidden rounded-card bg-surface-container-high">
        @if (gif.original.stillUrl; as stillUrl) {
          <!-- Still frame shown until the animated GIF paints over it. -->
          <img class="absolute inset-0 size-full object-contain" [src]="stillUrl" alt="" aria-hidden="true" />
        }
        <img
          class="relative block h-auto max-h-[55vh] w-auto max-w-full"
          [src]="gif.original.url"
          [width]="gif.original.width"
          [height]="gif.original.height"
          [alt]="gif.altText"
        />
      </div>

      <app-gif-meta-list [gif]="gif" />
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <a matButton [href]="gif.pageUrl" target="_blank" rel="noopener noreferrer">
      <mat-icon>open_in_new</mat-icon>
      Open on GIPHY
    </a>
    <button matButton type="button" (click)="facade.copyPageLink(gif)">
      <mat-icon>link</mat-icon>
      Copy GIPHY page link
    </button>
    <button matButton="tonal" type="button" (click)="facade.copyMediaLink(gif)">
      <mat-icon>content_copy</mat-icon>
      Copy link
    </button>
    <!-- disabledInteractive keeps the button focusable (aria-disabled) while the download runs. -->
    <button
      matButton="filled"
      type="button"
      disabledInteractive
      [disabled]="$isDownloading()"
      (click)="facade.download(gif)"
    >
      <!-- One node per branch, so it is projected into the button's icon slot. -->
      @if ($isDownloading()) {
        <mat-progress-spinner
          matButtonIcon
          class="[--mat-progress-spinner-active-indicator-color:currentColor]"
          mode="indeterminate"
          diameter="18"
        />
      } @else {
        <mat-icon>download</mat-icon>
      }
      {{ $isDownloading() ? 'Downloading…' : 'Download' }}
    </button>
  </mat-dialog-actions>
}
